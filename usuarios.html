<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuários — Agência Maravilha</title><link rel="stylesheet" href="menu1.css"><link rel="stylesheet" href="assets/styles.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#0f172a;color:#eef4ff;padding:76px 12px}main{max-width:1080px;margin:auto}.pane{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;margin-bottom:20px}.form-control,.form-select{background:#101828;color:#fff;border-color:#64748b}.form-control:focus,.form-select:focus{background:#101828;color:#fff}.table{--bs-table-bg:transparent;--bs-table-color:#fff;--bs-table-border-color:#334155}.muted{color:#b3c3d8}</style></head><body><div id="menu-placeholder"></div><main><h1>Gestão de usuários</h1><p class="muted">Somente administradores podem criar contas ou alterar permissões.</p><section class="pane"><h2 class="h5">Criar usuário</h2><form id="form" class="row g-3"><div class="col-md-6"><label>E-mail</label><input id="email" class="form-control" type="email" required></div><div class="col-md-6"><label>Senha inicial (mínimo 10 caracteres)</label><input id="senha" class="form-control" type="password" minlength="10" required autocomplete="new-password"></div><div class="col-md-4"><label>Perfil</label><select class="form-select" id="perfil"><option value="recrutador">Recrutador</option><option value="administrador">Administrador</option></select></div><div class="col-md-8" id="agenteBox"><label>Recrutador vinculado (nome_agente)</label><select id="agente" class="form-select" required><option value="">Carregando recrutadores...</option></select><div class="muted small">Selecione o mesmo nome utilizado em host_reports_simplificado.</div></div><div class="col-12"><button id="criar" class="btn btn-warning" type="submit">Criar conta</button></div></form><p id="msg" role="status" class="mt-3"></p></section><section class="pane"><h2 class="h5">Contas cadastradas</h2><div class="table-responsive"><table class="table"><thead><tr><th>E-mail</th><th>Perfil</th><th>Recrutador</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="lista"></tbody></table></div></section></main><script type="module">
import {supabase} from './supabase.js';
const $=id=>document.getElementById(id),msg=s=>$('msg').textContent=s;
const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('login.html');throw Error('Login necessário')}
const {data:perfil,error}=await supabase.from('agencia_usuarios').select('perfil,ativo').eq('user_id',user.id).single();
if(error||perfil?.perfil!=='administrador'||!perfil.ativo){document.querySelector('main').textContent='Acesso exclusivo do administrador. '+(error?.message||'');throw Error('Sem acesso')}
fetch('menu1.html').then(r=>r.text()).then(s=>$('menu-placeholder').innerHTML=s).catch(()=>{});
const fn='criar-usuario';
async function call(body){const {data,error}=await supabase.functions.invoke(fn,{body});if(error)throw Error(error.message);if(data?.error)throw Error(data.error);return data}
let agentes=[];
async function loadAgentes(){const {data,error}=await supabase.rpc('agencia_nomes_agentes');if(error){msg('Erro ao listar recrutadores: '+error.message);return}agentes=(data||[]).map(x=>x.nome_agente);renderAgentes()}
function renderAgentes(){const s=$('agente');s.replaceChildren(new Option('Selecione o recrutador',''));agentes.forEach(n=>s.add(new Option(n,n)))}
$('perfil').onchange=()=>{const recrutador=$('perfil').value==='recrutador';$('agenteBox').hidden=!recrutador;$('agente').required=recrutador};
$('form').onsubmit=async e=>{e.preventDefault();$('criar').disabled=true;msg('Criando conta...');try{await call({action:'create',email:$('email').value,senha:$('senha').value,perfil:$('perfil').value,nome_agente:$('perfil').value==='recrutador'?$('agente').value:''});msg('Conta criada. O usuário já pode entrar pelo login da Agência Maravilha.');$('form').reset();$('perfil').onchange();await load()}catch(e){msg('Erro: '+e.message)}finally{$('criar').disabled=false}};
async function load(){const out=await call({action:'list'});const tbody=$('lista');tbody.replaceChildren();for(const p of out.usuarios||[]){const tr=document.createElement('tr');const email=document.createElement('td');email.textContent=p.email;tr.append(email);const type=document.createElement('td');const select=document.createElement('select');select.className='form-select form-select-sm';for(const t of ['administrador','recrutador'])select.add(new Option(t,t));select.value=p.perfil;type.append(select);tr.append(type);const cell=document.createElement('td');const ag=document.createElement('select');ag.className='form-select form-select-sm';ag.add(new Option('Sem vínculo',''));agentsOptions(ag,p.nome_agente);cell.append(ag);tr.append(cell);const active=document.createElement('td');const check=document.createElement('input');check.type='checkbox';check.checked=p.ativo;active.append(check);tr.append(active);const act=document.createElement('td');const save=document.createElement('button');save.className='btn btn-sm btn-outline-warning';save.textContent='Salvar';save.onclick=async()=>{save.disabled=true;try{await call({action:'update',user_id:p.user_id,perfil:select.value,nome_agente:ag.value,ativo:check.checked});msg('Alteração salva.');await load()}catch(e){msg('Erro: '+e.message)}finally{save.disabled=false}};act.append(save);tr.append(act);tbody.append(tr)}}
function agentsOptions(select,value){if(value&&!agentes.includes(value))select.add(new Option(value,value));agentes.forEach(n=>select.add(new Option(n,n)));select.value=value||''}
await loadAgentes();await load();
</script><script type="module" src="menu-acessos.js"></script></body></html>
