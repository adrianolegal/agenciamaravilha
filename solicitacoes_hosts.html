<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Solicitar ingresso — Agência Maravilha</title><link rel="stylesheet" href="menu1.css"><link rel="stylesheet" href="assets/styles.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#101827;color:#f8fafc;padding:75px 12px}.pane{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;margin:16px auto;max-width:1150px}.form-control,.form-select{background:#101827;color:white;border-color:#64748b}.form-control:focus,.form-select:focus{background:#101827;color:white}.table{--bs-table-bg:transparent;--bs-table-color:white;--bs-table-border-color:#475569}.muted{color:#b9c6d8}</style></head><body><div id="menu-placeholder"></div><main class="container-fluid"><section class="pane"><h1>Solicitar ingresso de host</h1><p class="muted">O pedido fica vinculado ao seu usuário e aparece na central administrativa. O status de vínculo no Kwai só será confirmado após consulta no Voyager.</p><form id="form" class="row g-3"><div class="col-md-6"><label>Kwai ID *</label><input id="kwai" class="form-control" required autocomplete="off"><small id="check" class="muted">Vínculo não verificado</small></div><div class="col-md-6"><label>Nome do host</label><input id="nome" class="form-control"></div><div class="col-md-4"><label>Cooperação</label><input class="form-control" value="Entretenimento" disabled></div><div class="col-md-4"><label>Prazo</label><input class="form-control" value="Indeterminado" disabled></div><div class="col-md-4"><label>Preenchimento</label><input class="form-control" value="Agência" disabled></div><div class="col-md-4"><label>Contato da agência</label><input class="form-control" value="(41) 99116-1317" disabled></div><div class="col-md-4"><label>Plataforma de origem</label><select id="origem" class="form-select"><option value="">Selecione</option><option>Kwai</option><option>TikTok</option><option>Bigo</option><option>Likee</option><option>YouTube</option><option>Twitch</option><option>Others</option></select></div><div class="col-md-4"><label>ID da plataforma</label><input id="idOrigem" class="form-control"></div><div class="col-md-4"><label>Seguidores na plataforma</label><input id="seguidores" class="form-control" type="number" min="0"></div><div class="col-md-8"><label>Informações adicionais</label><textarea id="notas" class="form-control" rows="2" maxlength="200"></textarea></div><div class="col-12"><button class="btn btn-warning" id="send" type="submit">Registrar solicitação</button></div></form><p id="msg" class="mt-3" role="status"></p></section><section class="pane table-responsive"><h2 class="h5">Minhas solicitações</h2><table class="table"><thead><tr><th>Data</th><th>Kwai ID</th><th>Host</th><th>Status</th><th>Verificação</th></tr></thead><tbody id="rows"></tbody></table></section></main><script type="module">
import {supabase} from './supabase.js';const $=id=>document.getElementById(id);
const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('login.html');throw Error('Login necessário')}
const {data:prof,error:e}=await supabase.from('agencia_usuarios').select('perfil,ativo').eq('user_id',user.id).maybeSingle();if(e||!prof?.ativo){document.querySelector('main').textContent='Conta não autorizada';throw Error('Sem permissão')}
fetch('menu1.html').then(r=>r.text()).then(t=>$('menu-placeholder').innerHTML=t).catch(()=>{});
const say=s=>$('msg').textContent=s;
$('kwai').oninput=()=>{$('check').textContent='Vínculo ainda não verificado pelo Voyager'};
async function load(){const {data,error}=await supabase.from('agencia_solicitacoes_ingresso').select('created_at,kwai_id,nome_host,status,retorno_verificacao').order('created_at',{ascending:false}).limit(200);if(error){say('Erro ao consultar solicitações: '+error.message);return}const body=$('rows');body.replaceChildren();for(const r of data||[]){const tr=document.createElement('tr');for(const val of [new Date(r.created_at).toLocaleString('pt-BR'),r.kwai_id,r.nome_host||'—',r.status,r.retorno_verificacao||'Não verificado']){const td=document.createElement('td');td.textContent=val;tr.append(td)}body.append(tr)}}
$('form').onsubmit=async event=>{event.preventDefault();$('send').disabled=true;try{const kwai=$('kwai').value.trim();if(!kwai)throw Error('Informe o Kwai ID');const {data:existing,error:checkErr}=await supabase.from('agencia_solicitacoes_ingresso').select('id,status').eq('kwai_id',kwai).in('status',['pendente_verificacao','aguardando_aprovacao','aprovado','enviado']).limit(1);if(checkErr)throw checkErr;if(existing?.length)throw Error('Já existe uma solicitação ativa para este Kwai ID');const payload={solicitante_id:user.id,kwai_id:kwai,nome_host:$('nome').value.trim()||null,plataforma_origem:$('origem').value||null,id_plataforma:$('idOrigem').value.trim()||null,seguidores_plataforma:$('seguidores').value?Number($('seguidores').value):null,informacoes_adicionais:$('notas').value.trim()||null};const {error}=await supabase.from('agencia_solicitacoes_ingresso').insert(payload);if(error)throw error;say('Pedido registrado para conferência pelo administrador. Não foi enviado ao Voyager.');$('form').reset();await load()}catch(err){say('Erro: '+err.message)}finally{$('send').disabled=false}};
await load();
</script><script type="module" src="menu-acessos.js"></script></body></html>
