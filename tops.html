<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Ranking de Hosts</title>
<link rel="icon" href="assets/logo.jpg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu1.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<link href="assets/styles.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#0f172a;
color:white;
padding:80px;
font-family:Arial;
}

.card{
background:#1e293b;
border-radius:10px;
padding:20px;
margin-bottom:30px;
}

th{
color:#fbbf24;
}
.host-cell{display:flex;align-items:center;gap:8px;min-width:0}
.host-avatar{width:34px;height:34px;min-width:34px;max-width:34px;min-height:34px;max-height:34px;flex:0 0 34px;object-fit:cover;border-radius:50%;background:#334155}
.host-cell span{min-width:0;overflow-wrap:anywhere}
</style>
</head>

<body>

<div id="menu-placeholder"></div>

<script>
fetch('menu1.html')
.then(r => r.text())
.then(html => {
document.getElementById('menu-placeholder').innerHTML = html
})
</script>

<div class="container">

<h2 class="mb-4">Ranking de Hosts</h2>

<div class="card">

<h4 class="text-warning">Filtro</h4>

<div class="row">

<div class="col-md-4">
<label>Mês</label>
<select id="mes" class="form-select">
<option value="todos">Todos os meses</option>
<option value="1">Janeiro</option>
<option value="2">Fevereiro</option>
<option value="3">Março</option>
<option value="4">Abril</option>
<option value="5">Maio</option>
<option value="6">Junho</option>
<option value="7">Julho</option>
<option value="8">Agosto</option>
<option value="9">Setembro</option>
<option value="10">Outubro</option>
<option value="11">Novembro</option>
<option value="12">Dezembro</option>
</select>
</div>

<div class="col-md-4">
<label>Ano</label>
<input id="ano" type="number" value="2026" class="form-control">
</div>

<div class="col-md-4 d-flex align-items-end">
<button id="btnBuscar" class="btn btn-primary w-100">
Gerar Ranking
</button>
</div>

</div>
</div>

<div class="card">

<h4 class="text-warning">Top 5 Diamantes</h4>

<table class="table table-dark">
<thead>
<tr>
<th>#</th>
<th>Host</th>
<th>Kwai ID</th>
<th>Diamantes</th>
</tr>
</thead>

<tbody id="rankingDiamantes"></tbody>
</table>

</div>

<div class="card">

<h4 class="text-warning">Top 10 Horas de Live</h4>

<table class="table table-dark">

<thead>
<tr>
<th>#</th>
<th>Host</th>
<th>Kwai ID</th>
<th>Horas</th>
</tr>
</thead>

<tbody id="rankingHoras"></tbody>

</table>

</div>

</div>

<script type="module">

import { supabase, protectPage } from "./supabase.js"

await protectPage()

const btn = document.getElementById("btnBuscar")

const tabelaDiamantes = document.getElementById("rankingDiamantes")
const tabelaHoras = document.getElementById("rankingHoras")

btn.onclick = async () => {

const mesSelecionado = document.getElementById("mes").value
const todosMeses = mesSelecionado === "todos"
const mes = Number(mesSelecionado)
const ano = Number(document.getElementById("ano").value)

tabelaDiamantes.innerHTML = ""
tabelaHoras.innerHTML = ""



/* =========================
   BUSCAR DADOS
========================= */

let query=supabase.from("host_reports_simplificado")
.select("member_id,apelido_streamer,kwai_id,fluxo_presentes,duracao_transmissao,mes").eq("ano",ano);
if(!todosMeses)query=query.eq("mes",mes);
const {data,error}=await query

if(error){
console.error(error)
return
}



// Fotos dos perfis Kwai; falhas na consulta não interrompem o ranking.
const avatarMap=new Map();
const kwaiIds=[...new Set((data||[]).map(h=>String(h.kwai_id||'').trim()).filter(Boolean))];
for(let i=0;i<kwaiIds.length;i+=150){
 const {data:profiles,error:profileError}=await supabase.from('kwai_profiles')
  .select('kwai_id,avatar_url').in('kwai_id',kwaiIds.slice(i,i+150));
 if(profileError){console.warn('Fotos indisponíveis:',profileError.message);break}
 for(const p of profiles||[])if(p.avatar_url)avatarMap.set(String(p.kwai_id).trim().toLowerCase(),p.avatar_url);
}
function preencherHost(tr,h){
 const td=tr.children[1];if(!td)return;
 td.replaceChildren();
 const wrap=document.createElement('div');wrap.className='host-cell';
 const img=document.createElement('img');img.className='host-avatar';
 img.loading='lazy';img.alt='';img.referrerPolicy='no-referrer';
 img.src=avatarMap.get(String(h.kwai_id||'').trim().toLowerCase())||'assets/profile-placeholder.jpg';
 img.onerror=()=>{img.onerror=null;img.src='assets/profile-placeholder.jpg'};
 const name=document.createElement('span');name.textContent=h.apelido_streamer||'-';
 wrap.append(img,name);td.append(wrap);
}

function segundos(v){
 if(v==null||v==='')return 0;
 if(typeof v==='number')return Number.isFinite(v)?v:0;
 const txt=String(v).trim();
 if(/^\d+:\d{2}(?::\d{2})?$/.test(txt)){const p=txt.split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*3600+p[1]*60}
 return Number(txt.replace(',','.'))||0;
}
const agrupados=new Map();
for(const h of data||[]){
 const id=String(h.member_id||h.kwai_id||'').trim().toLowerCase();
 if(!id)continue;
 const atual=agrupados.get(id)||{...h,fluxo_presentes:0,segundosLive:0};
 atual.fluxo_presentes+=(Number(h.fluxo_presentes)||0);
 atual.segundosLive+=segundos(h.duracao_transmissao);
 if(h.apelido_streamer)atual.apelido_streamer=h.apelido_streamer;
 agrupados.set(id,atual);
}
const rankingData=[...agrupados.values()];
/* =========================
   TOP DIAMANTES
========================= */

const topDiamantes = [...rankingData]
.sort((a,b)=> (Number(b.fluxo_presentes)||0) - (Number(a.fluxo_presentes)||0))
.slice(0,5)

topDiamantes.forEach((h,i)=>{

const valor = Number(h.fluxo_presentes) || 0

const tr = document.createElement("tr")

tr.innerHTML = `
<td>${i+1}</td>
<td>${h.apelido_streamer || "-"}</td>
<td>@${h.kwai_id || "-"}</td>
<td>${valor.toLocaleString("pt-BR")}</td>
`

preencherHost(tr,h);tabelaDiamantes.appendChild(tr)

})



/* =========================
   FUNÇÃO HORAS
========================= */

function intervaloParaHoras(intervalo){

if(!intervalo) return 0

const partes = intervalo.split(":")

const h = parseInt(partes[0]) || 0
const m = parseInt(partes[1]) || 0

return h + (m/60)

}



/* =========================
   TOP HORAS
========================= */

const topHoras = [...rankingData]
.sort((a,b)=> b.segundosLive - a.segundosLive)
.slice(0,10)

topHoras.forEach((h,i)=>{

const horasLive = (h.segundosLive/3600).toFixed(1)

const tr = document.createElement("tr")

tr.innerHTML = `
<td>${i+1}</td>
<td>${h.apelido_streamer || "-"}</td>
<td>@${h.kwai_id || "-"}</td>
<td>${horasLive} h</td>
`

preencherHost(tr,h);tabelaHoras.appendChild(tr)

})

}

</script>

<script type="module" src="menu-acessos.js"></script></body>
</html>
