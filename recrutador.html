<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meus hosts — Agência Maravilha</title><link rel="stylesheet" href="assets/styles.css"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#0f172a;color:#e6eef9;padding:32px 12px}.wrap{max-width:1150px;margin:auto}.panel{background:#1e293b;padding:20px;border-radius:12px;margin:15px 0}.table{--bs-table-bg:transparent;--bs-table-color:#eef4ff;--bs-table-border-color:#334155}.form-control{background:#101828;color:#fff;border-color:#475569}</style></head><body><main class="wrap"><div class="d-flex align-items-center justify-content-between"><h1>Meus hosts</h1><button class="btn btn-outline-light" id="sair">Sair</button></div><p id="identidade"></p><section class="panel"><label>Buscar nome ou Kwai ID</label><input id="busca" class="form-control" placeholder="Pesquisar host"><div id="msg" class="mt-3"></div></section><section class="panel table-responsive"><table class="table"><thead><tr><th>Host</th><th>Kwai ID</th><th>Referência</th><th>Dias transmitidos</th><th>Duração</th><th>Presentes</th><th>Receita vídeo</th><th>Receita áudio</th></tr></thead><tbody id="dados"></tbody></table></section></main><script>window.location.replace("Adms.html");</script><script type="module">
import {supabase} from './supabase.js';
const $=id=>document.getElementById(id);const {data:{user}}=await supabase.auth.getUser();if(!user){location.replace('login.html');throw Error('Sem sessão')}
const {data:p,error:err}=await supabase.from('agencia_usuarios').select('perfil,nome_agente,ativo').eq('user_id',user.id).single();
if(err||!p?.ativo){$('msg').textContent='Conta sem acesso. '+(err?.message||'');throw Error('Bloqueado')}
$('identidade').textContent=p.perfil==='administrador'?'Visão administrativa':'Recrutador: '+p.nome_agente;
$('sair').onclick=async()=>{await supabase.auth.signOut();location.replace('login.html')};
let data=[];function fmt(v){return v==null?'—':String(v)}
function render(){const term=$('busca').value.trim().toLowerCase();const rows=data.filter(r=>!term||[r.apelido_streamer,r.kwai_id].some(v=>String(v||'').toLowerCase().includes(term)));$('dados').replaceChildren();for(const r of rows){const tr=document.createElement('tr');[r.apelido_streamer,r.kwai_id,(r.mes||'')+'/'+(r.ano||''),r.dias_transmissao,r.duracao_transmissao,r.fluxo_presentes,r.receita_video,r.receita_audio].forEach(v=>{const td=document.createElement('td');td.textContent=fmt(v);tr.append(td)});$('dados').append(tr)}$('msg').textContent=rows.length+' registro(s) no histórico disponível. A view mensal não fornece a data da última live.'}
$('busca').oninput=render;
try{const {data:rows,error}=await supabase.rpc('agencia_meus_hosts');if(error)throw error;data=rows||[];render()}catch(e){$('msg').textContent='Falha na consulta: '+e.message}
</script></body></html>
