<script type="module">
import { supabase, protectPage, logout } from "./supabase.js";
import * as XLSX from "https://cdn.sheetjs.com/xlsx-latest/package/xlsx.mjs";

await protectPage(); // protege a página

function showStatus(element, text, type="") {
  element.className = "status " + type;
  element.innerText = text;
  element.style.opacity = "1";
  element.style.animation = "none";
  element.style.display = "block";
}

// normaliza IDs e datas
// Converte datas da Tabela 1 sem depender de Date.parse para formatos brasileiros.
// O SheetJS usa objetos Date quando cellDates:true; o Voyager também pode
// exportar números seriais do Excel ou strings DD/MM/AAAA.
function dataVoyagerISO(value) {
  if(value == null || value === "") return null;
  if(value instanceof Date) return Number.isNaN(value.getTime()) ? null : value.toISOString();
  if(typeof value === "number") {
    const d = XLSX.SSF.parse_date_code(value);
    if(!d) return null;
    return new Date(Date.UTC(d.y,d.m-1,d.d,d.H||0,d.M||0,Math.floor(d.S||0))).toISOString();
  }
  const s=String(value).trim();
  if(!s) return null;
  const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?$/);
  if(br) {
    const day=+br[1],month=+br[2],year=+br[3];
    const d=new Date(Date.UTC(year,month-1,day,+(br[4]||0),+(br[5]||0),+(br[6]||0)));
    return d.getUTCFullYear()===year&&d.getUTCMonth()===month-1&&d.getUTCDate()===day?d.toISOString():null;
  }
  const iso=/^\d{4}-\d{2}-\d{2}(?:[T\s].*)?$/.test(s);
  if(!iso)return null;
  const d=new Date(s);
  return Number.isNaN(d.getTime())?null:d.toISOString();
}
function chaveColuna(texto) {
  return String(texto||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\u00a0/g," ").toLowerCase().replace(/[^a-z0-9]/g,"");
}
function prepararTabelaVoyager(linhas) {
  const primeira=linhas[0]||{};
  const colunas=Object.keys(primeira);
  const encontrar=(...nomes)=>colunas.find(c=>nomes.some(n=>chaveColuna(c)===chaveColuna(n)));
  const id=encontrar("member_Id","memberId","Member ID","UID","UID do streamer");
  const entrada=encontrar("Data de entrada","Data de ingresso","Data de adesão","Data de cooperacao","Data de cooperação","Join Date","Joining Date","Onboarding Date","Onborading Date","Cooperation Start Time");
  const apelido=encontrar("Apelido de streamer","Apelido do streamer","Streamer nickname");
  if(!id)throw Error("Coluna UID/member_Id não encontrada. Colunas da planilha: "+colunas.join(", "));
  if(!entrada)throw Error("Coluna Data de entrada não encontrada. Nenhum dado foi alterado. Colunas: "+colunas.join(", "));
  return {id,entrada,apelido,linhas:linhas.map(l=>{
    const r={...l,member_Id:l[id],"Data de entrada":l[entrada]};
    if(apelido)r["Apelido de streamer"]=l[apelido];
    // Não enviar nomes alternativos como colunas inexistentes ao Supabase.
    for(const c of [id,entrada,apelido])if(c&&
      !["member_Id","Data de entrada","Apelido de streamer"].includes(c))delete r[c];
    return r;
  })};
}
function normalizeData(data) {
  return data.map(row => {
    const normalized = {...row};
    if(normalized.member_Id) normalized.member_Id=Number(normalized.member_Id);
    for(const field of ["Data de entrada","Última transmissão ao vivo em","Última publicação em"]) {
      normalized[field]=dataVoyagerISO(row[field]);
    }
    return normalized;
  });
}
function excelDateToISO(value) {

  if (!value) return null;

  if (typeof value === "number") {
    const date = new Date((value - 25569) * 86400 * 1000);
    if (!isNaN(date)) return date.toISOString();
  }

  if (typeof value === "string") {
    const date = new Date(value);
    if (!isNaN(date)) return date.toISOString();
  }

  return null;
}
// Importação Voyager: atualiza presentes e marca ausentes como INATIVO, preservando BANIDO.
document.getElementById("btnImportHosts").addEventListener("click", async () => {
  const file=document.getElementById("fileHosts").files[0];
  const status=document.getElementById("statusHosts");
  const button=document.getElementById("btnImportHosts");
  if(!file)return showStatus(status,"Selecione a Tabela 1 do Kwai.","btn-error");
  button.disabled=true;
  try{
    const book=XLSX.read(await file.arrayBuffer(),{type:"array",cellDates:true});
    const original=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{defval:""});
    const preparada=prepararTabelaVoyager(original);
    const raw=preparada.linhas;
    const ids=raw.map(r=>String(r.member_Id||"").trim());
    if(!raw.length||ids.some(id=>!/^\d+$/.test(id))||new Set(ids).size!==ids.length)
      throw Error("Planilha vazia, UID inválido ou duplicado. Nada foi gravado.");
    showStatus(status,"Lendo hosts existentes no Supabase...","");
    const existing=[];
    for(let offset=0;;offset+=800){
      const {data,error}=await supabase.from("hosts").select('member_Id,Apelido de streamer,Data de entrada,Status de streamer,vinculo_ativo').order('member_Id',{ascending:true}).range(offset,offset+799);
      if(error)throw Error("Falha ao consultar hosts existentes: "+JSON.stringify({message:error.message,code:error.code,details:error.details,hint:error.hint}));
      existing.push(...(data||[]));
      if((data||[]).length<800)break;
    }
    const oldById=new Map(existing.map(x=>[String(x.member_Id),x]));
    const normalized=normalizeData(raw).map(row=>{
      const old=oldById.get(String(row.member_Id));
      if(old&&!String(row["Apelido de streamer"]||"").trim())row["Apelido de streamer"]=old["Apelido de streamer"];
      if(old&&!row["Data de entrada"])row["Data de entrada"]=old["Data de entrada"];
      row.vinculo_ativo=true;
      // Campos históricos são atualizados somente após a comparação completa.
      delete row.ultima_confirmacao_kwai;
      delete row.data_saida_agencia;
      delete row.atualizado_vinculo_em;
      return row;
    });
    const datas=normalized.filter(r=>r["Data de entrada"]).length;
    const exemplo=normalized.find(r=>r["Data de entrada"]);
    if(!datas)throw Error("Nenhuma Data de entrada reconhecida. Importação cancelada.");
    const resumo="Datas reconhecidas: "+datas+"/"+normalized.length+
      ". Exemplo UID "+(exemplo?.member_Id||"")+" = "+(exemplo?.["Data de entrada"]||"");
    const presentes=new Set(ids);
    const ausentes=existing.filter(h=>!presentes.has(String(h.member_Id)));
    const desativar=ausentes.filter(h=>String(h["Status de streamer"]||"").trim().toUpperCase()!=="BANIDO"&&(String(h["Status de streamer"]||"").trim().toUpperCase()!=="INATIVO"||h.vinculo_ativo!==false));
    const reativar=existing.filter(h=>presentes.has(String(h.member_Id))&&h.vinculo_ativo===false);
    if(!confirm("CONFERÊNCIA DA TABELA 1 COMPLETA\n"+resumo+
      "\nHosts existentes ausentes desta lista: "+ausentes.length+
      "\nSerão marcados como inativos: "+desativar.length+
      "\nSerão reativados: "+reativar.length+
      "\n\nConfirma que este arquivo contém TODOS os hosts atuais da agência?"))return;
    showStatus(status,"Importando... "+resumo,"");
    for(let i=0;i<normalized.length;i+=150){
      const {error}=await supabase.from("hosts").upsert(normalized.slice(i,i+150),{onConflict:"member_Id"});
      if(error)throw Error("Erro ao gravar hosts (lote "+(i+1)+"-"+Math.min(i+150,normalized.length)+"): "+JSON.stringify({message:error.message,code:error.code,details:error.details,hint:error.hint}));
    }
    // Só desativar os ausentes DEPOIS de concluir o upsert de todos os atuais.
    showStatus(status,"Atualizando vínculos de "+desativar.length+" hosts ausentes...","");
    for(let i=0;i<desativar.length;i+=100){
      const lote=desativar.slice(i,i+100).map(h=>h.member_Id);
      const {data,error}=await supabase.from("hosts")
        .update({"Status de streamer":"INATIVO",vinculo_ativo:false,atualizado_vinculo_em:new Date().toISOString()})
        .in("member_Id",lote).select("member_Id");
      if(error)throw Error("Falha ao marcar hosts ausentes: "+JSON.stringify({message:error.message,code:error.code,details:error.details,hint:error.hint}));
      if((data||[]).length!==lote.length)throw Error("Atualização incompleta de hosts ausentes. Verifique permissões.");
    }
    // Os presentes já recebem o status original do Voyager e vínculo ativo no upsert.
    showStatus(status,"Importação concluída. "+normalized.length+" na lista atual; "+
      desativar.length+" marcados como inativos; "+reativar.length+" reativados. Histórico mantido.","btn-success");
  }catch(err){console.error("Falha na importação Voyager:",err);showStatus(status,"ERRO NA IMPORTAÇÃO — "+err.message,"btn-error")}
  finally{button.disabled=false}
});

document.getElementById("confirmarPeriodo").addEventListener("click", async () => {

  const modalEl = document.getElementById("modalPeriodo");
  const modalInstance = bootstrap.Modal.getInstance(modalEl);

  const mes = Number(document.getElementById("mesInput").value);
  const ano = Number(document.getElementById("anoInput").value);

  const file = document.getElementById("fileReports").files[0];
  const status = document.getElementById("statusReports");

  if (!file) {
    showStatus(status, "Selecione um arquivo", "btn-error");
    return;
  }

  const reader = new FileReader();

  reader.onload = async (e) => {
    try {

      const dataArray = new Uint8Array(e.target.result);
      const workbook = XLSX.read(dataArray, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      let json = XLSX.utils.sheet_to_json(sheet);

      const formatted = json.map(row => ({
        member_id: Number(row.member_Id) || null,
        kwai_id: row.kwaiId || null,
        agencia_id: row["ID da agência"] || null,
        nome_agencia: row["Nome da Agência"] || null,
        apelido_streamer: row["Apelido de streamer"] || null,
        nome_agente: row["Nome do agente"] || null,
        duracao_transmissao: row["Duração da transmissão ao vivo"] || null,
        dias_transmissao: row["Dia(s) da transmissão ao vivo"] || null,
        dias_efetivos: row["Dia(s) efetivo(s) da transmissão  ao vivo"] || null,
        fluxo_presentes: row["Fluxo de presentes"] || null,
        novos_fas: row["Novos fãs da sala de transmissão ao vivo"] || null,
        duracao_video: row["Duração de live de vídeo "] || null,
        duracao_audio: row["Duração de live de áudio"] || null,
        receita_video: row["Receita de live de vídeo"] || null,
        receita_audio: row["Receita de presentes de live de áudio"] || null,
        dias_video: row["Dias efetivos de live de vídeo"] || null,
        presentes_convidado_video: row["Presentes recebidos como convidado de live em grupo de vídeo"] || null,
        presentes_streamer_video: row["Presentes recebidos como streamer de live em grupo de vídeo"] || null,
        presentes_convidado_audio: row["Presentes recebidos como convidado de live em grupo de áudio"] || null,
        presentes_streamer_audio: row["Presentes recebidos como streamer de live em grupo de áudio"] || null,
        duracao_chat: row["A duração da transmissão ao vivo da sala de bate-papo"] || null,
        sala_chat: row["Sala de chat com transmissão ao vivo"] || null,
        fluxo_caixa_magica: row["Fluxo de Caixa Mágica"] || null,
        mes: mes,
        ano: ano,
        updated_at: new Date().toISOString()
      }));

      const { error } = await supabase
        .from("host_reports")
        .upsert(formatted, { onConflict: "member_id,mes,ano" });

      if (error) {
        showStatus(status, "Erro: " + error.message, "btn-error");
      } else {
        showStatus(status, "Importação atualizada com sucesso ✓", "btn-success");
        modalInstance.hide(); // 🔥 agora fecha corretamente
      }

    } catch (err) {
      showStatus(status, "Erro inesperado: " + err.message, "btn-error");
    }
  };
  

  reader.readAsArrayBuffer(file);
});
