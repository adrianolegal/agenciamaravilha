<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Painel  de Hosts</title>
<link rel="icon" href="assets/logo.jpg">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="menu1.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" rel="stylesheet">
<link href="assets/styles.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:#0f172a;
color:white;
padding:80px;
font-family:Arial;
}

.card{
background:#1e293b;
border-radius:10px;
padding:20px;
margin-bottom:30px;
}

th{
color:#fbbf24;
}
</style>
</head>

<body>

<div id="menu-placeholder"></div>

<script>
fetch('menu1.html')
.then(r => r.text())
.then(html => {
document.getElementById('menu-placeholder').innerHTML = html
})
</script>
<div class="container">
    <h2>Painel de Hosts Simplificado</h2>

    <div class="card">
        <h4 class="text-warning">Buscar Host</h4>
        <input type="text" id="hostSearch" placeholder="Digite apelido ou Kwai ID" class="form-control mb-2">

        <div class="data-row mb-2"><span class="title">UID:</span> <span class="value" id="uid"></span></div>
        <div class="data-row mb-2"><span class="title">Apelido:</span> <span class="value" id="apelido"></span></div>
        <div class="data-row mb-3"><span class="title">Kwai ID:</span> <span class="value" id="kwai_id"></span></div>
        <div class="data-row mb-3"><span class="title">Data Entrada:</span> <span class="value" id="data_entrada"></span></div>
        
        <!-- Prévia do Kwai (ajustada para pegar avatar e followers já atualizados pelo Node.js) -->
        <div class="card bg-dark mb-3 p-2" id="kwaiPreview" style="display:none;">
            <h5 class="text-warning">Prévia do Kwai</h5>
            <a id="kwaiLink" href="" target="_blank" class="text-white mb-2 d-block">Ver perfil completo</a>
            <div class="d-flex align-items-center">
                <img id="kwaiProfileImg" class="rounded-circle me-2" alt="Foto do perfil">
                <div>
                    <div class="text-white fw-bold" id="kwaiName"></div>
                    <div class="text-white" id="kwaiFollowers">Seguindo preview…</div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="text-warning">Mês</label>
            <select id="mesInput" class="form-select"><option value="todos">Todos os meses</option>
                <option value="1">Janeiro</option><option value="2">Fevereiro</option>
                <option value="3">Março</option><option value="4">Abril</option>
                <option value="5">Maio</option><option value="6">Junho</option>
                <option value="7">Julho</option><option value="8">Agosto</option>
                <option value="9">Setembro</option><option value="10">Outubro</option>
                <option value="11">Novembro</option><option value="12">Dezembro</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="text-warning">Ano</label>
            <input type="number" id="anoInput" class="form-control" value="2026">
        </div>

        <button class="btn btn-brand" id="btnFiltrar">Aplicar Filtro</button>
        <div id="status" class="mt-2"></div>
    </div>

    <div class="card">
        <h4 class="text-warning">Resultados da Transmissão</h4><div id="resumoAnual" class="row g-2 mb-3" style="display:none"></div>
        <table class="table" id="resultTable">
            <thead>
                <tr>
                    <th id="colMes" style="display:none">Mês</th><th>Duração Transmissão</th>
                    <th>Dias Efetivos</th>
                    <th>Fluxo Presentes</th>
                    <th>Duração Vídeo</th>
                    <th>Duração Áudio</th>
                    <th>Receita Vídeo</th>
                    <th>Receita Áudio</th>
                    <th>Dias Vídeo</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script type="module">
import { supabase, protectPage, logout } from "./supabase.js";

await protectPage(); // protege a página

const hostSearch = document.getElementById('hostSearch');
const uid = document.getElementById('uid');
const apelido = document.getElementById('apelido');
const kwai_id = document.getElementById('kwai_id');
const data_entrada = document.getElementById('data_entrada');
const btnFiltrar = document.getElementById('btnFiltrar');
const mesInput = document.getElementById('mesInput');
const anoInput = document.getElementById('anoInput');
const status = document.getElementById('status');
const resultTable = document.querySelector('#resultTable tbody');

const kwaiPreview = document.getElementById('kwaiPreview');
const kwaiLink = document.getElementById('kwaiLink');
const kwaiProfileImg = document.getElementById('kwaiProfileImg');
const kwaiName = document.getElementById('kwaiName');
const kwaiFollowers = document.getElementById('kwaiFollowers');

let hostsData = [];
let selectedHost = null;

// Carrega hosts simplificados
async function carregarHosts() {
    const { data, error } = await supabase
        .from('hosts_simplificado')
        .select('member_id,apelido,kwai_id,data_entrada')
        .order('apelido', { ascending: true });

    if(error){ status.innerText = "Erro ao carregar hosts: " + error.message; return; }
    hostsData = data;
}

// Pesquisa tipo tonselect
hostSearch.addEventListener('input', e => {
    const filtro = e.target.value.toLowerCase();
    const encontrado = hostsData.find(h => 
        h.apelido.toLowerCase().includes(filtro) || h.kwai_id.toLowerCase().includes(filtro)
    );

    if(encontrado){
        selectedHost = encontrado;
        uid.textContent = encontrado.member_id;
        apelido.textContent = encontrado.apelido;
        kwai_id.textContent = encontrado.kwai_id;
        data_entrada.textContent = encontrado.data_entrada || '';
 // Formatar data para padrão brasileiro
    if(encontrado.data_entrada){
        const data = new Date(encontrado.data_entrada);
        data_entrada.textContent = data.toLocaleDateString('pt-BR');
    } else {
        data_entrada.textContent = '';
    }

        // Prévia segura do Kwai usando dados já atualizados
        kwaiPreview.style.display = 'block';
        kwaiLink.href = `https://kwai.com/@${encontrado.kwai_id}`;
        kwaiName.textContent = encontrado.apelido;

        // Aqui pega avatar e followers do supabase.js, que já atualizou via Node.js
        supabase.from('kwai_profiles')
          .select('avatar_url,followers')
          .eq('kwai_id', encontrado.kwai_id)
          .single()
          .then(res => {
              if(res.data){
                  kwaiProfileImg.src = res.data.avatar_url || 'assets/profile-placeholder.jpg';
                  kwaiFollowers.textContent = `Seguidores: ${res.data.followers ?? '-'}`;
              } else {
                  kwaiProfileImg.src = 'assets/profile-placeholder.jpg';
                  kwaiFollowers.textContent = 'Seguidores: -';
              }
          })
          .catch(err => {
              kwaiProfileImg.src = 'assets/profile-placeholder.jpg';
              kwaiFollowers.textContent = 'Erro ao carregar';
          });

    } else {
        selectedHost = null;
        uid.textContent = '';
        apelido.textContent = '';
        kwai_id.textContent = '';
        kwaiPreview.style.display = 'none';
    }
});

// Filtra host_reports_simplificado
btnFiltrar.addEventListener('click', async () => {
    resultTable.innerHTML = '';
    status.innerText = '';

    if(!selectedHost){
        status.innerText='Selecione um host válido';
        status.style.color = 'orange';
        return;
    } else {
        status.style.color = 'white';
    }

    const todosMeses=mesInput.value==='todos';
    const mes=Number(mesInput.value);
    const ano=Number(anoInput.value);
    const resumo=document.getElementById('resumoAnual');
    const colMes=document.getElementById('colMes');
    colMes.style.display=todosMeses?'':'none';
    resumo.style.display='none';resumo.replaceChildren();
    let query=supabase.from('host_reports_simplificado')
      .select('mes,duracao_transmissao,dias_efetivos,fluxo_presentes,duracao_video,duracao_audio,receita_video,receita_audio,dias_video')
      .eq('member_id',selectedHost.member_id).eq('ano',ano);
    if(!todosMeses)query=query.eq('mes',mes);
    const {data,error}=await query.order('mes',{ascending:true});
    if(error){status.innerText='Erro: '+error.message;return}
    if(!data?.length){status.innerText='Nenhum dado encontrado';return}
    const numero=v=>{if(v==null||v==='')return 0;const n=Number(String(v).replace(',','.'));return Number.isFinite(n)?n:0};
    const segundos=v=>{
      if(v==null||v==='')return 0;
      if(typeof v==='number')return Number.isFinite(v)?v:0;
      const t=String(v).trim();
      if(/^\d+:\d{2}(?::\d{2})?$/.test(t)){const p=t.split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*3600+p[1]*60}
      return numero(t);
    };
    const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    if(todosMeses){
      const totalTransmissao=data.reduce((sum,d)=>sum+segundos(d.duracao_transmissao),0);const totalVideo=data.reduce((sum,d)=>sum+segundos(d.duracao_video),0);const totalAudio=data.reduce((sum,d)=>sum+segundos(d.duracao_audio),0);const formatarDuracao=v=>{const n=Math.round(v);return String(Math.floor(n/3600))+':'+String(Math.floor(n%3600/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
      const totalDias=data.reduce((sum,d)=>sum+numero(d.dias_efetivos),0);
      const totalDiamantes=data.reduce((sum,d)=>sum+numero(d.fluxo_presentes),0);
      for(const [rotulo,valor] of [['Duração transmissão',formatarDuracao(totalTransmissao)],['Duração vídeo',formatarDuracao(totalVideo)],['Duração áudio',formatarDuracao(totalAudio)],['Dias efetivos',totalDias.toLocaleString('pt-BR')],['Diamantes',totalDiamantes.toLocaleString('pt-BR')]]){
        const item=document.createElement('div');item.className='col-md-4 col-lg';
        const card=document.createElement('div');card.className='border border-secondary rounded p-3 h-100';card.style.cssText='background:#111827;color:#fff;min-height:94px';
        const titulo=document.createElement('div');titulo.className='text-warning';titulo.textContent=rotulo;
        const value=document.createElement('strong');value.className='d-block fs-5 mt-2';value.style.color='#fff';value.textContent=valor;card.append(titulo,value);item.append(card);resumo.append(item);
      }
      resumo.style.display='';
    }
    for(const d of data){
      const tr=document.createElement('tr');
      const valores=[...(todosMeses?[meses[Number(d.mes)-1]||String(d.mes)]:[]),d.duracao_transmissao,d.dias_efetivos,d.fluxo_presentes,d.duracao_video,d.duracao_audio,d.receita_video,d.receita_audio,d.dias_video];
      for(const v of valores){const td=document.createElement('td');td.textContent=v??'';tr.append(td)}
      resultTable.append(tr);
    }
    status.innerText=todosMeses?'Mostrando '+data.length+' registro(s) de '+ano+' — totais do ano acima.':'Mostrando '+data.length+' registro(s)';

});

// Inicializa
carregarHosts();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="menu-acessos.js"></script></body>
</html>
